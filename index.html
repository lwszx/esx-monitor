<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>乐鑫科技 688018</title>
<link rel="manifest" href="data:application/json,{&quot;name&quot;:&quot;乐鑫688018&quot;,&quot;short_name&quot;:&quot;乐鑫&quot;,&quot;start_url&quot;:&quot;.&quot;,&quot;display&quot;:&quot;standalone&quot;,&quot;background_color&quot;:&quot;%230d1117&quot;,&quot;theme_color&quot;:&quot;%230d1117&quot;,&quot;icons&quot;:[{&quot;src&quot;:&quot;data:image/svg%2Bxml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'%3E%3Crect width='192' height='192' fill='%230d1117'/%3E%3Ctext x='96' y='128' font-size='96' text-anchor='middle' fill='%23f85149'%3E%E4%B9%90%3C/text%3E%3C/svg%3E&quot;,&quot;sizes&quot;:&quot;192x192&quot;,&quot;type&quot;:&quot;image/svg+xml&quot;}]}">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0d1117;--card:#161b22;--line:#21262d;--txt:#e6edf3;--dim:#8b949e;--dim2:#6e7681;
  --up:#f85149;--dn:#3fb950;--gold:#d29922;--blue:#58a6ff;
}
body{background:var(--bg);color:var(--txt);font:15px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;padding:0 0 40px;max-width:560px;margin:0 auto;overflow-x:hidden;-webkit-font-smoothing:antialiased}
.wrap{padding:0 16px}
header{padding:18px 16px 6px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
h1{font-size:17px;font-weight:600;letter-spacing:.3px}
.code{font-size:12px;color:var(--dim2);font-family:ui-monospace,Menlo,monospace}
.badge{margin-left:auto;font-size:11px;padding:2px 8px;border-radius:10px;background:var(--card);color:var(--dim);border:1px solid var(--line)}
.badge.live{color:var(--up);border-color:#4a1f1f;background:#1f1416}
.badge.live::before{content:"●";margin-right:4px;font-size:8px;vertical-align:1px;animation:bl 1.6s infinite}
@keyframes bl{50%{opacity:.25}}

.price{font-size:52px;font-weight:700;line-height:1.05;letter-spacing:-1.5px;font-variant-numeric:tabular-nums;transition:color .3s}
.price.up{color:var(--up)}.price.dn{color:var(--dn)}.price.flat{color:var(--txt)}
.chg{font-size:17px;font-weight:600;margin-top:2px;font-variant-numeric:tabular-nums}
.chg.up{color:var(--up)}.chg.dn{color:var(--dn)}.chg.flat{color:var(--dim)}
.sub{font-size:12.5px;color:var(--dim);margin-top:6px;font-variant-numeric:tabular-nums}
.spark{margin:10px 0 4px;height:44px}
.spark svg{width:100%;height:44px;display:block}

.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.cell{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.cell .k{font-size:11px;color:var(--dim2);margin-bottom:3px}
.cell .v{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}

.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:12px}
.card.sigA{border-color:#6b2222;background:linear-gradient(180deg,#1d1416,#161b22)}
.card.sigB{border-color:#5a4415;background:linear-gradient(180deg,#1c1811,#161b22)}
.sighead{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.sighead .t{font-size:12px;color:var(--dim)}
.lv{font-size:10px;padding:1px 6px;border-radius:8px;font-weight:700;letter-spacing:.5px}
.lv.A{background:#4a1d1d;color:#ff7b72}
.lv.B{background:#3d3011;color:#e3b341}
.lv.C{background:#21262d;color:var(--dim)}
.sigmain{font-size:16px;font-weight:600;line-height:1.45;margin-bottom:8px}
.adv{font-size:13px;color:var(--dim);padding-left:2px}
.adv b{color:var(--txt);font-weight:600}
.adv div{margin-top:3px}
.extras{font-size:12.5px;color:var(--gold);margin-top:6px}

.pos{display:flex;gap:8px;margin:10px 0 8px}
.pos input{flex:1;min-width:0;background:#0d1117;border:1px solid var(--line);border-radius:8px;color:var(--txt);padding:9px 10px;font-size:15px;font-variant-numeric:tabular-nums;-webkit-appearance:none}
.pos input::placeholder{color:var(--dim2)}
.pos button{background:#1f6feb;color:#fff;border:0;border-radius:8px;padding:0 16px;font-size:14px;font-weight:600}
.pos button:active{opacity:.7}
.pl{font-size:14px;margin-top:4px;font-variant-numeric:tabular-nums}
.pl .big{font-size:18px;font-weight:700}
.pl.up{color:var(--up)}.pl.dn{color:var(--dn)}
.pladv{font-size:12.5px;color:var(--dim);margin-top:4px}

table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
td{padding:8px 0;font-size:13.5px;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
td.r{text-align:right;color:var(--dim)}
td.r.hot{color:var(--gold);font-weight:600}
td.r.near{color:var(--blue);font-weight:600}
.sec{font-size:12px;color:var(--dim2);margin:16px 0 2px;letter-spacing:.5px}

footer{text-align:center;font-size:11px;color:var(--dim2);margin-top:22px;line-height:1.8}
.err{background:#2d1b1b;border:1px solid #6b2222;color:#ffa198;padding:10px 12px;border-radius:10px;font-size:13px;margin-top:12px}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>乐鑫科技</h1><span class="code">688018.SH</span>
  <span class="badge" id="mkt">连接中</span>
</header>

<div class="price flat" id="price">--</div>
<div class="chg flat" id="chg">&nbsp;</div>
<div class="sub" id="sub">正在获取行情…</div>
<div class="spark"><svg id="spark" viewBox="0 0 300 44" preserveAspectRatio="none"></svg></div>

<div class="grid3">
  <div class="cell"><div class="k">成交额</div><div class="v" id="amt">--</div></div>
  <div class="cell"><div class="k">量比</div><div class="v" id="vr">--</div></div>
  <div class="cell"><div class="k">换手</div><div class="v" id="to">--</div></div>
</div>

<div class="card" id="sigcard">
  <div class="sighead"><span class="t">判 · 现在该做什么</span><span class="lv C" id="lv">--</span></div>
  <div class="sigmain" id="sigmain">计算中…</div>
  <div class="adv" id="adv"></div>
  <div class="extras" id="extras"></div>
</div>

<div class="card">
  <div class="sighead"><span class="t">我的持仓</span><span style="margin-left:auto;font-size:11px;color:var(--dim2)">只存本机</span></div>
  <div class="pos">
    <input id="cost" type="number" inputmode="decimal" placeholder="成本价" step="0.01">
    <input id="shares" type="number" inputmode="numeric" placeholder="股数">
    <button id="save">存</button>
  </div>
  <div class="pl" id="pl">填了才算盈亏</div>
  <div class="pladv" id="pladv"></div>
</div>

<div class="sec">关键位</div>
<div class="card"><table id="levels"></table></div>

<div class="sec">均线 / 指标</div>
<div class="card"><table id="inds"></table></div>

<footer>
  <div id="ts">--</div>
  <div>数据: 腾讯行情 · 15 秒自动刷新</div>
</footer>
</div>

<script>
const CODE='sh688018';
const KEY={nh:183.85,ph:176.15,brk:167.30,mid:160.13,gap:158.25,ma20ref:149.05,ma60ref:125.29};

const $=id=>document.getElementById(id);
const f2=(v,n=2)=>Number(v).toFixed(n);

// 用 <script> 标签取数，完全绕开跨域限制（腾讯接口本来就是 JS 变量格式）
function loadJS(url){
  return new Promise((res,rej)=>{
    const s=document.createElement('script');
    let done=false;
    s.src=url;
    s.onload=()=>{ if(done)return; done=true; s.remove(); res(); };
    s.onerror=()=>{ if(done)return; done=true; s.remove(); rej(new Error('数据加载失败')); };
    document.head.appendChild(s);
    setTimeout(()=>{ if(done)return; done=true; s.remove(); rej(new Error('连接超时')); },10000);
  });
}

async function getQuote(){
  try{ delete window.v_sh688018; }catch(e){ window.v_sh688018=undefined; }
  await loadJS('https://qt.gtimg.cn/q='+CODE+'&_='+Date.now());
  const raw=window.v_sh688018;
  if(!raw) throw new Error('行情未返回');
  const f=String(raw).split('~');
  const n=i=>{const v=parseFloat(f[i]);return isFinite(v)?v:0;};
  return {name:f[1],price:n(3),prev:n(4),open:n(5),high:n(33),low:n(34),
    change:n(31),chgPct:n(32),amtWan:n(37),turnover:n(38),pe:n(39),
    amp:n(43),mcap:n(45),pb:n(46),vr:n(49),avg:n(51),time:f[30]||''};
}

async function getKline(){
  try{ delete window.esxK; }catch(e){ window.esxK=undefined; }
  await loadJS('https://web.ifzq.gtimg.cn/appstock/app/fqkline/get?param='+CODE+',day,,,120,qfq&_var=esxK&_='+Date.now());
  const j=window.esxK;
  const raw=j?.data?.[CODE]?.qfqday||j?.data?.[CODE]?.day||[];
  return raw.map(r=>({d:r[0],c:+r[2],h:+r[3],l:+r[4],v:+r[5]}));
}

const sma=(arr,n)=>arr.length<n?0:arr.slice(-n).reduce((a,b)=>a+b,0)/n;

function rsiWilder(cl,n){
  if(cl.length<=n) return 0;
  let ag=0,al=0;
  for(let i=1;i<=n;i++){const d=cl[i]-cl[i-1];d>=0?ag+=d:al-=d;}
  ag/=n;al/=n;
  for(let i=n+1;i<cl.length;i++){
    const d=cl[i]-cl[i-1];
    ag=(ag*(n-1)+Math.max(d,0))/n;
    al=(al*(n-1)+Math.max(-d,0))/n;
  }
  return al?100-100/(1+ag/al):100;
}

function marketState(t){
  const d=new Date();
  const bj=new Date(d.getTime()+(d.getTimezoneOffset()+480)*60000);
  const wd=bj.getDay();
  if(wd===0||wd===6) return {t:'周末休市',live:false};
  const hm=bj.getHours()*60+bj.getMinutes();
  if(hm>=555&&hm<565) return {t:'集合竞价',live:true};
  if((hm>=570&&hm<690)||(hm>=780&&hm<900)) return {t:'交易中',live:true};
  if(hm>=690&&hm<780) return {t:'午间休市',live:false};
  if(hm<555) return {t:'盘前',live:false};
  return {t:'已收盘',live:false};
}

function sparkline(cl){
  if(cl.length<2) return '';
  const pts=cl.slice(-30);
  const mn=Math.min(...pts),mx=Math.max(...pts),rg=mx-mn||1;
  const step=300/(pts.length-1);
  const y=v=>42-((v-mn)/rg)*38;
  let d='';
  pts.forEach((v,i)=>{d+=(i?'L':'M')+(i*step).toFixed(1)+' '+y(v).toFixed(1)+' ';});
  const up=pts[pts.length-1]>=pts[0];
  const col=up?'#f85149':'#3fb950';
  const gid='g'+Math.random().toString(36).slice(2,7);
  return `<defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="${col}" stop-opacity=".28"/>
    <stop offset="100%" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
    <path d="${d}L300 44 L0 44 Z" fill="url(#${gid})"/>
    <path d="${d}" fill="none" stroke="${col}" stroke-width="1.5" stroke-linejoin="round"/>`;
}

function buildSignals(q,cl){
  const p=q.price, ch=q.chgPct, vr=q.vr, to=q.turnover, am=q.amtWan/10000;
  const m5=sma(cl,5),m10=sma(cl,10),m20=sma(cl,20),m60=sma(cl,60);
  const r6=rsiWilder(cl,6), r14=rsiWilder(cl,14);
  const S=[];
  const add=(lv,side,txt)=>S.push({lv,side,txt});

  if(m60&&p<m60) add('A','卖',`跌破 MA60(${f2(m60)})，趋势彻底破坏 → 清仓`);
  else if(m20&&p<m20&&ch<-2) add('A','卖',`跌破 MA20(${f2(m20)}) 且跌 ${f2(ch)}% → 清仓`);
  if(ch<=-7&&am>=25) add('A','卖',`放量长阴 ${f2(ch)}% / ${f2(am,0)}亿 → 减半`);
  if(p>=KEY.ph*0.98&&vr<1.2) add('B','卖',`冲前高 ${KEY.ph} 滞涨 → 减 30%`);
  if(r6>85&&to>8) add('B','卖',`RSI6 ${f2(r6,0)} 超买 + 换手 ${f2(to)}% → 减 20%`);
  if(p>KEY.nh&&am>25) add('A','买',`破历史新高且放量 → 跟进 20%`);
  if(m20&&Math.abs(p-m20)/m20<=0.02&&vr<0.85&&ch>-1) add('B','买',`回踩 MA20 缩量止跌 → 建仓 30%`);
  if(p>KEY.brk&&vr>1.5) add('B','买',`站上 ${KEY.brk} 放量 → 加仓 30%`);
  if(m60&&p<=m60*1.03&&r6<25) add('B','买',`跌至 MA60 超卖 → 短线试仓`);

  if(!S.length){
    if(m5&&p<m5) add('C','看',`跌破 MA5(${f2(m5)})，短线转弱`);
    else add('C','看','无明确信号，持有观察');
  }
  return {S,m5,m10,m20,m60,r6,r14};
}

function render(q,cl){
  const p=q.price, ch=q.chgPct;
  const cls=ch>0.001?'up':ch<-0.001?'dn':'flat';
  $('price').textContent=f2(p);
  $('price').className='price '+cls;
  $('chg').textContent=(ch>=0?'+':'')+f2(q.change)+'  '+(ch>=0?'+':'')+f2(ch)+'%';
  $('chg').className='chg '+cls;
  $('sub').textContent=`开 ${f2(q.open)} 高 ${f2(q.high)} 低 ${f2(q.low)} 昨收 ${f2(q.prev)} 振幅 ${f2(q.amp)}%`;
  $('amt').textContent=f2(q.amtWan/10000)+'亿';
  $('vr').textContent=f2(q.vr);
  $('to').textContent=f2(q.turnover)+'%';

  const st=marketState();
  const el=$('mkt');
  el.textContent=st.t;
  el.className='badge'+(st.live?' live':'');

  if(cl.length>1) $('spark').innerHTML=sparkline(cl.map(x=>x.c));

  const {S,m5,m10,m20,m60,r6,r14}=buildSignals(q,cl);
  const top=S[0];
  const card=$('sigcard');
  card.className='card '+(top.lv==='A'?'sigA':top.lv==='B'?'sigB':'');
  $('lv').textContent=top.lv+' 级';
  $('lv').className='lv '+top.lv;
  $('sigmain').textContent=(top.side==='卖'?'卖出':top.side==='买'?'买入':'观察')+'｜'+top.txt;

  const advs=[];
  if(top.side==='卖') advs.push(`<div>持仓 → 按比例减，破 <b>${m20?f2(m20):'149'}</b> 清仓</div>`);
  else if(top.side==='买') advs.push(`<div>空仓 → 分批建，止损 <b>${KEY.gap}</b> 下方</div>`);
  else advs.push(`<div>持仓 → 拿住，破 <b>${KEY.mid}</b> 减半</div>`);
  $('adv').innerHTML=advs.join('');
  const rest=S.slice(1,3).map(s=>`<div>· ${s.side} ${s.txt}</div>`).join('');
  $('extras').innerHTML=rest;

  const rows=[
    ['历史新高',KEY.nh],['前高',KEY.ph],['突破线',KEY.brk],
    ['多空分界',KEY.mid],['缺口下沿',KEY.gap],
    ['MA20 生命线',m20||KEY.ma20ref],['MA60',m60||KEY.ma60ref]
  ];
  $('levels').innerHTML=rows.map(([k,v])=>{
    const d=(p/v-1)*100;
    const c=Math.abs(d)<1.2?'near':'';
    return `<tr><td>${k}</td><td class="r">${f2(v)}</td><td class="r ${c}">${d>=0?'+':''}${f2(d)}%</td></tr>`;
  }).join('');

  $('inds').innerHTML=[
    ['MA5',m5],['MA10',m10],['MA20',m20],['MA60',m60],
    ['RSI6',r6,0],['RSI14',r14,0]
  ].map(([k,v,n])=>{
    const d=v&&p?(p/v-1)*100:0;
    if(n===0) return `<tr><td>${k}</td><td class="r">${f2(v,0)}</td><td class="r">${v>70?'超买':v<30?'超卖':'中性'}</td></tr>`;
    return `<tr><td>${k}</td><td class="r">${f2(v)}</td><td class="r ${p<v?'hot':''}">${d>=0?'+':''}${f2(d)}%</td></tr>`;
  }).join('');

  const bj=new Date(Date.now()+(new Date().getTimezoneOffset()+480)*60000);
  $('ts').textContent='更新 '+bj.toTimeString().slice(0,8)+'  现价 '+f2(p);

  updatePL(p,m20);
}

function calcPL(p,cost){
  const pl=(p/cost-1)*100;
  const pl1=Math.round(pl*10)/10;
  const adv=pl1>=25?'减仓落袋':pl1>=15?'减 1/3 锁利':pl1>=8?'持有，止损上移到成本'
    :pl1>=0?'守成本':pl1>=-8?'看 MA20 止跌':'破纪律线，减仓';
  return {pl,pl1,adv};
}

function updatePL(p,m20){
  const cost=parseFloat($('cost').value)||0;
  const sh=parseFloat($('shares').value)||0;
  if(!cost){ $('pl').textContent='填了才算盈亏'; $('pl').className='pl'; $('pladv').textContent=''; return; }
  const {pl,pl1,adv}=calcPL(p,cost);
  $('pl').className='pl '+(pl>=0?'up':'dn');
  $('pl').innerHTML=`成本 ${f2(cost)} → 浮动 <span class="big">${pl>=0?'+':''}${f2(pl)}%</span>`+(sh?`  ${pl>=0?'+':''}${f2((p-cost)*sh,0)} 元`:'');
  $('pladv').textContent=adv+(m20?`　｜　MA20 ${f2(m20)}`:'');
}

async function refresh(){
  try{
    const [q,cl]=await Promise.all([getQuote(),getKline().catch(()=>[])]);
    render(q,cl);
  }catch(e){
    $('sub').textContent='获取失败: '+e.message;
    $('sub').className='err';
  }
}

$('save').onclick=()=>{
  localStorage.setItem('esx_cost',$('cost').value);
  localStorage.setItem('esx_shares',$('shares').value);
  $('save').textContent='已存';
  setTimeout(()=>$('save').textContent='存',900);
  refresh();
};
$('cost').value=localStorage.getItem('esx_cost')||'';
$('shares').value=localStorage.getItem('esx_shares')||'';

refresh();
setInterval(refresh,15000);
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) refresh(); });
</script>
</body>
</html>
